# Render Blueprint — deploys the BuildTrack Express API as a persistent web service.
# In Render: New → Blueprint → point at this repo. Fill the `sync: false` vars in the dashboard.
services:
  - type: web
    name: buildtrack-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        value: rzp_live_Svewe29nCOCstC
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_BASIC_MONTHLY
        value: plan_SvfQ1zSgoC6M64
      - key: RAZORPAY_PLAN_PRO_MONTHLY
        value: plan_SvfQ2AFGXZdz2C
      - key: RAZORPAY_PLAN_ENTERPRISE_MONTHLY
        value: plan_SvfQ2LvWJwYtE4
      - key: RAZORPAY_PLAN_BASIC_YEARLY
        value: plan_SvfQ2k3OwhTr5x
      - key: RAZORPAY_PLAN_PRO_YEARLY
        value: plan_SvfQ32QDSzGfGh
      - key: RAZORPAY_PLAN_ENTERPRISE_YEARLY
        value: plan_SvfQ3QVL8yHl2C
